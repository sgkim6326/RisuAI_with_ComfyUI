name: risuai

services:
  risuai:
    container_name: risuai
    image: risuai:2026.11.01-vm-chatjson
    restart: always
    volumes:
      - risuai-save:/app/save
    environment:
      VITE_RISU_LEGAL_CONFIGURED: "true"
      TRUST_PROXY: "1"

  https-proxy:
    image: nginx:alpine
    restart: always
    depends_on:
      - risuai
    ports:
      - "100.113.241.23:29999:443"
      - "[fd7a:115c:a1e0::8c01:f1ba]:29999:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  risuai-save:
